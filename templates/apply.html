<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>입시설명회 신청</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        background: #f5f6f8;

        font-family: Pretendard, Arial, sans-serif;

        color: #191919;
      }

      .container {
        max-width: 520px;

        margin: 50px auto;

        padding: 0 20px;
      }

      .box {
        background: white;

        padding: 32px;

        border-radius: 18px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
      }

      h1 {
        margin-top: 0;

        text-align: center;

        font-size: 26px;
      }

      .status {
        display: flex;

        justify-content: space-between;

        margin: 22px 0 28px;

        padding: 16px;

        background: #f8fafc;

        border-radius: 10px;

        font-size: 14px;
      }

      #timer {
        color: #dc2626;

        font-weight: 700;
      }

      .remain {
        color: #2563eb;

        font-weight: 700;
      }

      label {
        display: block;

        margin-top: 18px;

        margin-bottom: 7px;

        font-weight: 700;
      }

      input,
      select {
        width: 100%;

        padding: 13px 14px;

        border: 1px solid #d1d5db;

        border-radius: 9px;

        font-size: 16px;

        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #2563eb;
      }

      .phone {
        display: flex;

        align-items: center;

        gap: 7px;
      }

      .phone input {
        text-align: center;

        min-width: 0;
      }

      .phone span {
        color: #777;
      }

      .submit-btn {
        width: 100%;

        margin-top: 30px;

        padding: 15px;

        border: 0;

        border-radius: 10px;

        background: #2563eb;

        color: white;

        font-size: 17px;

        font-weight: 700;

        cursor: pointer;
      }

      .submit-btn:disabled {
        background: #94a3b8;
      }

      .notice {
        margin-top: 20px;

        color: #666;

        font-size: 13px;

        line-height: 1.7;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="box">
        <h1>입시설명회 신청</h1>

        <div class="status">
          <div>
            남은 좌석 :
            <span class="remain"> {{ remaining }}석 </span>
          </div>

          <div>
            남은 시간 :
            <span id="timer"> </span>
          </div>
        </div>

        <form id="reserveForm" action="/reserve" method="POST">
          <label> 학생 이름 </label>

          <input
            type="text"
            id="studentName"
            name="student_name"
            autocomplete="name"
            maxlength="20"
            placeholder="학생 이름"
            required
          />

          <label> 학생 전화번호 </label>

          <div class="phone">
            <input
              id="studentPhone1"
              type="text"
              value="010"
              maxlength="3"
              inputmode="numeric"
              required
            />

            <span>-</span>

            <input
              id="studentPhone2"
              type="text"
              maxlength="4"
              inputmode="numeric"
              required
            />

            <span>-</span>

            <input
              id="studentPhone3"
              type="text"
              maxlength="4"
              inputmode="numeric"
              required
            />
          </div>

          <input type="hidden" id="studentPhone" name="student_phone" />

          <label> 보호자 이름 </label>

          <input
            type="text"
            id="parentName"
            name="parent_name"
            maxlength="20"
            placeholder="보호자 이름"
            required
          />

          <label> 보호자 전화번호 </label>

          <div class="phone">
            <input
              id="parentPhone1"
              type="text"
              value="010"
              maxlength="3"
              inputmode="numeric"
              required
            />

            <span>-</span>

            <input
              id="parentPhone2"
              type="text"
              maxlength="4"
              inputmode="numeric"
              required
            />

            <span>-</span>

            <input
              id="parentPhone3"
              type="text"
              maxlength="4"
              inputmode="numeric"
              required
            />
          </div>

          <input type="hidden" id="parentPhone" name="parent_phone" />

          <label> 신청 인원 </label>

          <select name="people_count" required>
            <option value="1">1명</option>

            <option value="2">2명</option>
          </select>

          <button type="submit" id="submitBtn" class="submit-btn">
            신청 완료
          </button>
        </form>

        <div class="notice">
          ※ 제한 시간이 지나면 자동으로 메인 화면으로 이동합니다.

          <br />

          ※ 학생 전화번호 기준으로 중복 신청이 제한됩니다.
        </div>
      </div>
    </div>

    <script>

      const form =
          document.getElementById(
              "reserveForm"
          );

      const submitBtn =
          document.getElementById(
              "submitBtn"
          );


      const studentName =
          document.getElementById(
              "studentName"
          );

      const parentName =
          document.getElementById(
              "parentName"
          );


      const s1 =
          document.getElementById(
              "studentPhone1"
          );

      const s2 =
          document.getElementById(
              "studentPhone2"
          );

      const s3 =
          document.getElementById(
              "studentPhone3"
          );


      const p1 =
          document.getElementById(
              "parentPhone1"
          );

      const p2 =
          document.getElementById(
              "parentPhone2"
          );

      const p3 =
          document.getElementById(
              "parentPhone3"
          );


      function numbersOnly(
          input
      ) {

          input.value =
              input.value.replace(
                  /[^0-9]/g,
                  ""
              );
      }


      function autoMove(
          current,
          next,
          length
      ) {

          current.addEventListener(
              "input",
              () => {

                  numbersOnly(
                      current
                  );

                  if (
                      current.value.length
                      === length
                  ) {

                      next.focus();
                  }
              }
          );
      }


      autoMove(
          s1,
          s2,
          3
      );

      autoMove(
          s2,
          s3,
          4
      );

      // 학생 전화번호 마지막 →
      // 보호자 이름
      autoMove(
          s3,
          parentName,
          4
      );


      autoMove(
          p1,
          p2,
          3
      );

      autoMove(
          p2,
          p3,
          4
      );


      p3.addEventListener(
          "input",
          () => {

              numbersOnly(p3);
          }
      );


      function validName(
          value
      ) {

          return /^[가-힣a-zA-Z\s]{2,20}$/
              .test(
                  value.trim()
              );
      }


      form.addEventListener(
          "submit",
          event => {

              event.preventDefault();


              if (
                  !validName(
                      studentName.value
                  )
              ) {

                  alert(
                      "학생 이름을 정확히 입력해주세요."
                  );

                  studentName.focus();

                  return;
              }


              if (
                  !validName(
                      parentName.value
                  )
              ) {

                  alert(
                      "보호자 이름을 정확히 입력해주세요."
                  );

                  parentName.focus();

                  return;
              }


              if (
                  s1.value.length !== 3 ||
                  s2.value.length < 3 ||
                  s2.value.length > 4 ||
                  s3.value.length !== 4
              ) {

                  alert(
                      "학생 전화번호를 정확히 입력해주세요."
                  );

                  s1.focus();

                  return;
              }


              if (
                  p1.value.length !== 3 ||
                  p2.value.length < 3 ||
                  p2.value.length > 4 ||
                  p3.value.length !== 4
              ) {

                  alert(
                      "보호자 전화번호를 정확히 입력해주세요."
                  );

                  p1.focus();

                  return;
              }


              document
                  .getElementById(
                      "studentPhone"
                  )
                  .value =
                      `${s1.value}-${s2.value}-${s3.value}`;


              document
                  .getElementById(
                      "parentPhone"
                  )
                  .value =
                      `${p1.value}-${p2.value}-${p3.value}`;


              submitBtn.disabled =
                  true;

              submitBtn.textContent =
                  "신청 처리 중...";


              form.submit();
          }
      );


      // =============================
      // 타이머
      // =============================

      let remainingTime =
          {{ remaining_time }};

      async function heartbeat() {
          try {
              const response = await fetch(
                  "/heartbeat",
                  { method: "POST", cache: "no-store" }
              );
              const data = await response.json();
              if (!response.ok || !data.valid) {
                  location.replace("/");
                  return;
              }
              // 서버의 절대 마감 시각을 기준으로 브라우저 타이머 오차를 보정한다.
              remainingTime = Number(data.remaining_time || 0);
          } catch (error) {
              // 일시적인 네트워크 실패 한 번으로 사용자를 내보내지 않는다.
              console.error("heartbeat failed", error);
          }
      }


      function updateTimer() {

          const minutes =
              Math.floor(
                  remainingTime / 60
              );

          const seconds =
              remainingTime % 60;


          document
              .getElementById(
                  "timer"
              )
              .textContent =
                  `${minutes}:${String(seconds).padStart(2, "0")}`;


          if (
              remainingTime <= 0
          ) {

              expire();

              return;
          }


          remainingTime--;
      }


      async function expire() {

          try {

              await fetch(
                  "/leave",
                  {
                      method: "POST"
                  }
              );

          } catch (e) {

              console.error(e);
          }

          location.replace("/");
      }


      updateTimer();

      heartbeat();

      setInterval(
          heartbeat,
          10000
      );

      setInterval(
          updateTimer,
          1000
      );


    </script>
  </body>
</html>
