<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>티켓팅 신청</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial,sans-serif}.container{max-width:520px;margin:70px auto;padding:0 20px}.box{background:#fff;padding:34px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.07)}h1{text-align:center;margin-top:0}.status{display:flex;justify-content:space-between;margin:22px 0 30px;padding:16px;background:#f8fafc;border-radius:10px}.remain{color:#2563eb;font-weight:700}#timer{color:#dc2626;font-weight:700}label{display:block;margin:18px 0 8px;font-weight:700}input{width:100%;padding:16px;border:1px solid #d1d5db;border-radius:10px;font-size:22px;text-align:center;letter-spacing:4px}input:focus{outline:none;border-color:#2563eb}.submit-btn{width:100%;margin-top:26px;padding:15px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:17px;font-weight:700;cursor:pointer}.submit-btn:disabled{background:#94a3b8}.hint{margin-top:14px;color:#64748b;font-size:13px;text-align:center}
  </style>
</head>
<body>
<div class="container"><div class="box">
  <h1>학생 티켓팅 테스트</h1>
  <div class="status">
    <div>남은 좌석 <span class="remain">{{ remaining }}석</span></div>
    <div>남은 시간 <span id="timer"></span></div>
  </div>

  <form id="reserveForm" action="/reserve" method="POST">
    <label for="studentNumber">학번</label>
    <input id="studentNumber" name="student_number" type="text" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="예: 21121" required autofocus />
    <div class="hint">숫자 5자리 학번만 입력해주세요.</div>
    <button id="submitBtn" class="submit-btn" type="submit">신청하기</button>
  </form>
</div></div>

<script>
  const form = document.getElementById("reserveForm");
  const input = document.getElementById("studentNumber");
  const submitBtn = document.getElementById("submitBtn");

  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^0-9]/g, "").slice(0, 5);
  });

  form.addEventListener("submit", (e) => {
    if (!/^\d{5}$/.test(input.value)) {
      e.preventDefault();
      alert("학번을 숫자 5자리로 입력해주세요.");
      input.focus();
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = "처리 중...";
  });

  let remainingTime = {{ remaining_time }};
  let finished = false;

  async function expire() {
    if (finished) return;
    finished = true;
    try { await fetch("/leave", { method: "POST" }); } catch(e) {}
    location.replace("/");
  }

  function tick() {
    const min = Math.floor(remainingTime / 60);
    const sec = remainingTime % 60;
    document.getElementById("timer").textContent = `${min}:${String(sec).padStart(2,"0")}`;
    if (remainingTime <= 0) return expire();
    remainingTime--;
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
