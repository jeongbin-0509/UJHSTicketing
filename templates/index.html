<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>운정고등학교 입시설명회</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Pretendard, Arial, sans-serif;

        background: #f5f6f8;
        color: #191919;
      }

      header {
        height: 72px;

        background: white;

        border-bottom: 1px solid #e5e7eb;

        display: flex;
        align-items: center;

        padding: 0 40px;

        font-size: 20px;
        font-weight: 700;
      }

      .container {
        max-width: 920px;

        margin: 60px auto;

        padding: 0 20px;
      }

      .card {
        background: white;

        border-radius: 18px;

        overflow: hidden;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
      }

      .top {
        padding: 40px;
      }

      .tag {
        display: inline-block;

        color: #2563eb;

        font-size: 14px;
        font-weight: 700;

        margin-bottom: 12px;
      }

      h1 {
        margin: 0 0 24px;

        font-size: 30px;
      }

      .info {
        color: #555;

        line-height: 1.9;
      }

      .bottom {
        border-top: 1px solid #eee;

        padding: 28px 40px;

        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .remaining {
        font-size: 16px;
      }

      .remaining strong {
        color: #2563eb;
        font-size: 20px;
      }

      button {
        padding: 15px 36px;

        border: 0;

        border-radius: 10px;

        background: #2563eb;
        color: white;

        font-size: 17px;
        font-weight: 700;

        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        background: #94a3b8;
        cursor: default;
      }

      .notice {
        background: white;

        margin-top: 22px;

        padding: 25px 30px;

        border-radius: 14px;

        color: #555;

        line-height: 1.9;
      }

      @media (max-width: 600px) {
        header {
          padding: 0 20px;
        }

        .container {
          margin-top: 30px;
        }

        .top {
          padding: 28px;
        }

        .bottom {
          padding: 24px 28px;

          flex-direction: column;

          align-items: stretch;

          gap: 20px;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <header>운정고등학교</header>

    <main class="container">
      <section class="card">
        <div class="top">
          <div class="tag">입시설명회</div>

          <h1>2026 운정고등학교 입시설명회</h1>

          <div class="info">
            일시 : 추후 입력<br />
            장소 : 운정고등학교<br />
            대상 : 중학생 및 보호자
          </div>
        </div>

        <div class="bottom">
          <div class="remaining">
            남은 좌석

            <strong> {{ remaining }} </strong>

            석
          </div>

          {% if remaining > 0 %}

          <button id="reserveBtn">예매하기</button>

          {% else %}

          <button disabled>예매 마감</button>

          {% endif %}
        </div>
      </section>

      <section class="notice">
        <strong> 예매 안내 </strong>

        <br /><br />

        · 예매하기 버튼을 누르면 대기열에 입장합니다.

        <br />

        · 동시에 최대 30명까지 신청 페이지에 입장합니다.

        <br />

        · 신청 페이지 입장 후 제한 시간 내 신청을 완료해야 합니다.

        <br />

        · 신청 완료 시 좌석이 자동 배정됩니다.
      </section>
    </main>

    <script>
      const button = document.getElementById("reserveBtn");

      if (button) {
        button.addEventListener("click", () => {
          button.disabled = true;

          button.textContent = "예매창 접속 중...";

          location.href = "/enter";
        });
      }
    </script>
  </body>
</html>
