<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>예매 대기</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        background: #f5f6f8;

        font-family: Pretendard, Arial, sans-serif;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
      }

      .box {
        width: 440px;

        background: white;

        padding: 42px 32px;

        border-radius: 18px;

        text-align: center;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 25px;
        margin: 0;
      }

      .loader {
        width: 55px;
        height: 55px;

        border: 6px solid #e5e7eb;

        border-top-color: #2563eb;

        border-radius: 50%;

        margin: 30px auto;

        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .position {
        font-size: 19px;

        color: #2563eb;

        font-weight: 700;

        margin-top: 15px;
      }

      .queue-no {
        margin-top: 10px;

        color: #555;
      }

      .description {
        margin-top: 25px;

        color: #666;

        line-height: 1.7;

        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h1>예매 대기 중입니다</h1>

      <div class="loader"></div>

      <div class="position" id="position">대기 순서를 확인하고 있습니다.</div>

      <div class="queue-no" id="queueNo"></div>

      <div class="description">
        접속 순서대로 예매 페이지에 입장합니다.

        <br />

        이 페이지를 닫지 말고 잠시 기다려 주세요.
      </div>
    </div>

    <script>
      let checking = false;

      let moving = false;

      async function checkQueue() {
        if (checking || moving) {
          return;
        }

        checking = true;

        try {
          const response = await fetch("/queue/status", {
            cache: "no-store",
          });

          if (response.status === 401) {
            location.replace("/");
            return;
          }

          const data = await response.json();

          if (!data.valid) {
            location.replace("/");
            return;
          }

          document.getElementById("queueNo").textContent =
            `내 대기번호 : ${data.queue_no}번`;

          if (data.can_enter) {
            moving = true;

            document.getElementById("position").textContent =
              "입장 중입니다...";

            location.replace("/apply");

            return;
          }

          document.getElementById("position").textContent =
            `앞에 ${data.waiting_count}명이 대기 중입니다.`;
        } catch (error) {
          console.error(error);

          document.getElementById("position").textContent =
            "서버에 다시 연결하고 있습니다...";
        } finally {
          checking = false;
        }
      }

      checkQueue();

      setInterval(checkQueue, 2000);
    </script>
  </body>
</html>
