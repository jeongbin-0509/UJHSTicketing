<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예매 대기</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f6f8;
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .box {
        width: 440px;
        background: #fff;
        border-radius: 18px;
        padding: 42px 32px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }
      .loader {
        width: 55px;
        height: 55px;
        margin: 30px auto;
        border: 6px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .position {
        color: #2563eb;
        font-size: 20px;
        font-weight: 700;
      }
      .live-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
        color: #16803c;
        font-size: 12px;
        font-weight: 700;
      }
      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45);
        animation: pulse 1.6s infinite;
      }
      @keyframes pulse {
        70% {
          box-shadow: 0 0 0 7px rgba(34, 197, 94, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
      }
      .updated-at {
        min-height: 18px;
        margin-top: 4px;
        color: #9ca3af;
        font-size: 12px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .number {
        margin-top: 12px;
        color: #555;
      }
      .description {
        margin-top: 28px;
        color: #666;
        font-size: 14px;
        line-height: 1.7;
      }
      @media (prefers-reduced-motion: reduce) {
        .live-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>예매 대기 중입니다</h1>
      <div class="loader"></div>
      <div id="position" class="position">
        대기 순서를 확인하고 있습니다.
      </div>
      <div id="positionAnnouncement" class="sr-only" aria-live="polite"></div>
      <div class="live-status">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="liveText">실시간 순번 확인 중</span>
      </div>
      <div id="updatedAt" class="updated-at"></div>
      <div id="queueNumber" class="number"></div>
      <div class="description">
        접속 순서대로 예매 페이지에 입장합니다.<br />이 페이지를 닫지 말고
        기다려 주세요.
      </div>
    </div>
    <script>
      let checking = false;
      let moving = false;
      let timer = null;
      let displayedCount = null;
      let countAnimation = null;

      function setPositionCount(count) {
        document.getElementById("position").textContent =
          `앞에 ${count.toLocaleString("ko-KR")}명이 있습니다.`;
      }

      function animatePositionCount(nextCount) {
        if (countAnimation) cancelAnimationFrame(countAnimation);
        if (displayedCount === null || nextCount >= displayedCount) {
          displayedCount = nextCount;
          setPositionCount(nextCount);
          document.getElementById("positionAnnouncement").textContent =
            `앞에 ${nextCount}명이 있습니다.`;
          return;
        }

        const startCount = displayedCount;
        const startedAt = performance.now();
        const duration = Math.min(700, Math.max(220, (startCount - nextCount) * 24));

        function frame(now) {
          const progress = Math.min((now - startedAt) / duration, 1);
          displayedCount = Math.round(startCount + (nextCount - startCount) * progress);
          setPositionCount(displayedCount);
          if (progress < 1) {
            countAnimation = requestAnimationFrame(frame);
          } else {
            displayedCount = nextCount;
            countAnimation = null;
            document.getElementById("positionAnnouncement").textContent =
              `앞에 ${nextCount}명이 있습니다.`;
          }
        }

        countAnimation = requestAnimationFrame(frame);
      }

      function markUpdated() {
        document.getElementById("liveText").textContent = "실시간 순번 반영 중";
        document.getElementById("updatedAt").textContent =
          `${new Date().toLocaleTimeString("ko-KR")} 갱신`;
      }

      function nextDelay(count) {
        // 뒤쪽 사용자는 천천히, 입장 직전 사용자만 빠르게 확인.
        if (count <= 3) return 350;
        if (count <= 10) return 700;
        if (count <= 30) return 1200;
        if (count <= 100) return 2500;
        if (count <= 300) return 5000;
        return 8000;
      }

      function scheduleNext(ms) {
        // 모든 브라우저 요청이 같은 순간에 몰리지 않도록 jitter 추가
        const jitter = Math.floor(Math.random() * 250);
        clearTimeout(timer);
        timer = setTimeout(checkQueue, ms + jitter);
      }

      async function checkQueue() {
        if (checking || moving) return;
        checking = true;
        try {
          const response = await fetch("/queue/status", { cache: "no-store" });
          if (response.status === 401) {
            location.replace("/");
            return;
          }
          const data = await response.json();
          if (!data.valid) {
            location.replace("/");
            return;
          }

          document.getElementById("queueNumber").textContent =
            `대기번호 ${data.queue_no}번`;

          if (data.can_enter) {
            moving = true;
            document.getElementById("position").textContent =
              "예매 페이지로 이동합니다.";
            location.replace("/apply");
            return;
          }

          const count = Number(data.waiting_count || 0);
          animatePositionCount(count);
          markUpdated();
          scheduleNext(nextDelay(count));
        } catch (error) {
          console.error(error);
          document.getElementById("position").textContent =
            "서버에 다시 연결하고 있습니다.";
          document.getElementById("liveText").textContent = "연결 재시도 중";
          document.getElementById("updatedAt").textContent = "";
          scheduleNext(3000);
        } finally {
          checking = false;
        }
      }

      checkQueue();
    </script>
  </body>
</html>
